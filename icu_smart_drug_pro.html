  <style>
    body { 
      background-color: #f8fafc; 
      color: #1e293b;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      min-height: 100vh;
      background-image:

        radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
        radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
      background-attachment: fixed;
    }
    
    .bg-gradient-cover {
      background: linear-gradient(135deg, #e0e7ff 0%, #fce7f3 50%, #f3e8ff 100%);
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    
    input[type="number"] { font-family: 'Prompt', sans-serif; }
    input[type="number"]::-webkit-inner-spin-button, 
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

    /* Modal Animation */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .animate-fadeIn { animation: fadeIn 0.2s ease-out forwards; }
    .animate-slideUp { animation: slideUp 0.3s ease-out forwards; }

      { id: 'terlipressin', generic: 'Terlipressin', trade: 'Glypressin', class: 'Cardiovascular', routes: ['IV'], fluids: 'D5W, NSS', loading: '❌ ไม่มี loading', conditionSpecific: 'Variceal bleeding/Hepatorenal', maintenance: '1 mg q 4-6 hr', unit: 'mg', calcType: 'mg_bolus', concentrations: { Peripheral: [{ label: '0.01 mg/mL (10 mcg/mL)', mg: 1, ml: 100, text: 'Terlipressin 1 mg (8.5 mL) + D5W/NSS 91.5 ml' }] }, limits: 'Max: 2 mg q 4 hr', precautions: 'Ischemia', contra: 'Pregnancy', seriousSE: 'Ischemia', onset: '30 min', halfLife: '6 hrs' },

      // --- 11. Respiratory ---
      { id: 'aminophylline', generic: 'Aminophylline', trade: '-', class: 'Respiratory', routes: ['IV'], fluids: 'D5W, NSS, LRI', loading: '5 - 6 mg/kg', maintenance: '0.4 - 0.6 mg/kg/hr', unit: 'mg/kg/hr', calcType: 'mg_kg_hr', concentrations: { Peripheral: [{ label: '250:250 (1 mg/mL)', mg: 250, ml: 250, text: 'Aminophylline 250 mg + NSS 250 ml' }] }, limits: 'Max: Rate max 25 mg/min', precautions: 'Arrhythmia', contra: 'PUD', seriousSE: 'Seizure', onset: 'Rapid', halfLife: '8 hrs' }
    ];

    // ⚙️ CALCULATOR ENGINES (2-Way)
    const calcRateFromDose = (dose, drug, conc, wt) => {
      if (!dose || dose <= 0) return '';
      const getConcMgMl = () => conc.mg / conc.ml;
      const getConcMcgMl = () => (conc.mg * 1000) / conc.ml;
      const getConcGMl = () => (conc.mg / 1000) / conc.ml;
      let rate = 0;
      switch(drug.calcType) {
        case 'mcg_kg_min': rate = (dose * wt * 60) / getConcMcgMl(); break;
        case 'mcg_kg_hr': rate = (dose * wt) / getConcMcgMl(); break;
        case 'mcg_min': rate = (dose * 60) / getConcMcgMl(); break;
        case 'mcg_hr': rate = dose / getConcMcgMl(); break;
        
        // สำหรับ Iloprost (ng/kg/min) => 1 mg = 1,000,000 ng
        case 'ng_kg_min': rate = (dose * wt * 60) / (getConcMgMl() * 1000000); break; 
        
        case 'mg_kg_min': rate = (dose * wt * 60) / getConcMgMl(); break;
        case 'mg_kg_hr': rate = (dose * wt) / getConcMgMl(); break;
        case 'mg_min': rate = (dose * 60) / getConcMgMl(); break;
        case 'mg_hr': rate = dose / getConcMgMl(); break;
        case 'g_hr': rate = dose / getConcGMl(); break;
        case 'u_kg_hr': rate = (dose * wt) / getConcMgMl(); break;
        case 'u_min': rate = (dose * 60) / getConcMgMl(); break;
        case 'u_hr': rate = dose / getConcMgMl(); break;
        case 'meq_hr': rate = dose / getConcMgMl(); break;
        case 'ml_hr': rate = dose; break;
        case 'mg_kg_bolus': rate = (dose * wt) / getConcMgMl(); break;
        case 'u_kg_bolus': rate = (dose * wt) / getConcMgMl(); break;
        case 'mg_bolus': rate = dose / getConcMgMl(); break;
        case 'g_kg_bolus': rate = (dose * wt) / getConcGMl(); break;
        case 'g_bolus': rate = dose / getConcGMl(); break;
        default: return '';
      }
      return rate > 0 ? rate : '';
    };

    const calcDoseFromRate = (rate, drug, conc, wt) => {
      if (!rate || rate <= 0) return '';
      const getConcMgMl = () => conc.mg / conc.ml;
      const getConcMcgMl = () => (conc.mg * 1000) / conc.ml;
      const getConcGMl = () => (conc.mg / 1000) / conc.ml;
      let dose = 0;
      switch(drug.calcType) {
        case 'mcg_kg_min': dose = (rate * getConcMcgMl()) / (wt * 60); break;
        case 'mcg_kg_hr': dose = (rate * getConcMcgMl()) / wt; break;
        case 'mcg_min': dose = (rate * getConcMcgMl()) / 60; break;
        case 'mcg_hr': dose = (rate * getConcMcgMl()); break;
        
        // สำหรับ Iloprost (ng/kg/min)
        case 'ng_kg_min': dose = (rate * getConcMgMl() * 1000000) / (wt * 60); break;
        
        case 'mg_kg_min': dose = (rate * getConcMgMl()) / (wt * 60); break;
        case 'mg_kg_hr': dose = (rate * getConcMgMl()) / wt; break;
        case 'mg_min': dose = (rate * getConcMgMl()) / 60; break;
        case 'mg_hr': dose = (rate * getConcMgMl()); break;
        case 'g_hr': dose = (rate * getConcGMl()); break;
        case 'u_kg_hr': dose = (rate * getConcMgMl()) / wt; break;
        case 'u_min': dose = (rate * getConcMgMl()) / 60; break;
        case 'u_hr': dose = (rate * getConcMgMl()); break;
        case 'meq_hr': dose = (rate * getConcMgMl()); break;
        case 'ml_hr': dose = rate; break;
        case 'mg_kg_bolus': dose = (rate * getConcMgMl()) / wt; break;
        case 'u_kg_bolus': dose = (rate * getConcMgMl()) / wt; break;
        case 'mg_bolus': dose = (rate * getConcMgMl()); break;
        case 'g_kg_bolus': dose = (rate * getConcGMl()) / wt; break;
        case 'g_bolus': dose = (rate * getConcGMl()); break;
        default: return '';
      }
      return dose > 0 ? dose : '';
    };

    function App() {
      const [weight, setWeight] = useState('');
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedDrug, setSelectedDrug] = useState(null);
      const [route, setRoute] = useState(null); 
      const [selectedConc, setSelectedConc] = useState(null);
      const [doseInput, setDoseInput] = useState('');
      const [rateInput, setRateInput] = useState('');
      
      const [showDropdown, setShowDropdown] = useState(false);
      const [showClinicalModal, setShowClinicalModal] = useState(false);
      const searchRef = useRef(null);

      // 💡 BUG FIX: ใช้ Optional Chaining (?.) เพื่อป้องกัน Error จาก undefined
      const filteredDrugs = useMemo(() => {
        if (!searchQuery) return DRUG_DB;
        const lowerQuery = searchQuery.toLowerCase();
        return DRUG_DB.filter(d => 
          (d.generic?.toLowerCase().includes(lowerQuery)) || 
          (d.trade?.toLowerCase().includes(lowerQuery)) || 
          (d.class?.toLowerCase().includes(lowerQuery))
        );
      }, [searchQuery]);

      const handleSelectDrug = (drug) => { 
        setSelectedDrug(drug); 
        setSearchQuery(`${drug.generic} ${drug.trade && drug.trade !== '-' ? `(${drug.trade})` : ''}`); 
        setShowDropdown(false); 
        if (!(drug.routes || []).includes('IV')) setRoute('Peripheral');
        else setRoute(null); 
        setSelectedConc(null); 
        setDoseInput(''); setRateInput('');
      };

      const handleResetDrug = () => {
        setSelectedDrug(null);
        setSearchQuery('');
        setRoute(null);
        setSelectedConc(null);
        setDoseInput(''); setRateInput('');
      };
      
      const handleRouteSelect = (newRoute) => { 
        setRoute(newRoute); setSelectedConc(null); setDoseInput(''); setRateInput(''); 
      };

      const wtNum = parseFloat(weight) || 0;
      const isWeightNeeded = selectedDrug && selectedDrug.calcType.includes('kg');
      const isMissingWeight = isWeightNeeded && wtNum <= 0;

      // ฟังก์ชันคำนวณ Loading Dose ตามน้ำหนัก (Task 1)
      const calculateLoading = (loadingStr, wt) => {
        if (!wt || wt <= 0 || !loadingStr) return null;
        const str = loadingStr.toLowerCase();
        if (!str.includes('kg')) return null;

        const regexRange = /([\d.]+)\s*-\s*([\d.]+)\s*(mg|mcg|g|units|u|mEq)\/kg/i;
        const regexSingle = /([\d.]+)\s*(mg|mcg|g|units|u|mEq)\/kg/i;

        let match = loadingStr.match(regexRange);
        if (match) {
            const min = (parseFloat(match[1]) * wt).toFixed(1).replace(/\.0$/, '');
            const max = (parseFloat(match[2]) * wt).toFixed(1).replace(/\.0$/, '');
            const unit = match[3];
            return `${min} - ${max} ${unit}`;
        }

        match = loadingStr.match(regexSingle);
        if (match) {
            const val = (parseFloat(match[1]) * wt).toFixed(1).replace(/\.0$/, '');
            const unit = match[2];
            return `${val} ${unit}`;
        }
        
        return null;
      };

      // 💡 BUG FIX: สั่งให้คำนวณ Dose กับ Rate ใหม่อัตโนมัติเวลาเปลี่ยนน้ำหนัก (Weight)
      useEffect(() => {
        if (selectedConc && !isMissingWeight) {
           if (doseInput !== '') {
               const r = calcRateFromDose(parseFloat(doseInput), selectedDrug, selectedConc, wtNum);
               setRateInput(r !== '' ? Number(r.toFixed(2)).toString() : '');
           } else if (rateInput !== '') {
               const d = calcDoseFromRate(parseFloat(rateInput), selectedDrug, selectedConc, wtNum);
               setDoseInput(d !== '' ? Number(d.toFixed(4)).toString() : '');
           }
        } else if (isMissingWeight) {
            setDoseInput(''); setRateInput('');
        }
      }, [weight, selectedConc]);

      const onDoseChange = (val) => {
        setDoseInput(val);
        if(val === '' || isMissingWeight || !selectedConc) { setRateInput(''); return; }
        const r = calcRateFromDose(parseFloat(val), selectedDrug, selectedConc, wtNum);
        setRateInput(r !== '' ? Number(r.toFixed(2)).toString() : '');
      };

      const onRateChange = (val) => {
        setRateInput(val);
        if(val === '' || isMissingWeight || !selectedConc) { setDoseInput(''); return; }
        const d = calcDoseFromRate(parseFloat(val), selectedDrug, selectedConc, wtNum);
        setDoseInput(d !== '' ? Number(d.toFixed(4)).toString() : '');
      };

      useEffect(() => {
        const handleClickOutside = (event) => {
          if (searchRef.current && !searchRef.current.contains(event.target)) setShowDropdown(false);
        };
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, []);

      const getCategoryEmoji = (cat) => {
        if(!cat) return '📑';
        if(cat.includes('Vasopressor') || cat.includes('Inotropes')) return '💉';
        if(cat.includes('Sedative') || cat.includes('Epileptic') || cat.includes('Hypnotic') || cat.includes('Anxiolytic')) return '🧠';
        if(cat.includes('Neuromuscular')) return '⚡';
        if(cat.includes('Antiarrhythmic') || cat.includes('Cardiovascular') || cat.includes('Hypertensive')) return '🫀';
        if(cat.includes('Electrolyte') || cat.includes('Diuretic')) return '💧';
        if(cat.includes('Metabolic') || cat.includes('GI')) return '💊';
        if(cat.includes('Anticoagulant') || cat.includes('Blood')) return '🩸';
        if(cat.includes('Resuscitation') || cat.includes('Antidote')) return '🚑';
        if(cat.includes('Respiratory')) return '🫁';
        return '📑';
      };

      return (
        <div className="min-h-screen pb-20 flex flex-col items-center relative font-sans">
          {/* Header Cover */}
          <div className="w-full bg-gradient-cover pt-12 pb-24 px-4 md:px-8 shadow-sm rounded-b-[40px] relative z-10 border-b border-white/50">
            <div className="max-w-4xl mx-auto flex flex-col items-center justify-center text-center">
              <div className="bg-white/40 p-4 rounded-3xl backdrop-blur-md shadow-sm mb-4">
                <span className="text-5xl leading-none block drop-shadow-md">✨</span>
              </div>
              <h1 className="text-4xl md:text-5xl font-black tracking-tight text-pastel-navy drop-shadow-sm mb-2">ICU Smart Drug <span className="text-pastel-primary">Pro</span></h1>
              <p className="text-pastel-slate font-bold mb-5 tracking-wide">Advance 2-Way Calculator & Guidelines</p>
              <div className="inline-flex items-center gap-2 px-5 py-2 bg-white/70 backdrop-blur-md rounded-full shadow-sm border border-white font-bold text-pastel-primary text-xs tracking-widest uppercase">
                👨‍⚕️ Created By Oatto MDCU72
              </div>
            </div>
          </div>

          <main className="w-full max-w-4xl px-4 md:px-8 -mt-16 space-y-6 relative z-20">
            {/* Weight Input */}
            <section className="glass-card p-6 md:p-8 rounded-[32px] shadow-soft relative flex flex-col items-center justify-center">
                <label className="block text-sm font-black text-pastel-primary mb-3 uppercase tracking-widest">Weight (KG) ⚖️</label>
                <div className="relative w-full max-w-xs">
                  <input 
                    type="number" 
                    className="w-full bg-white border-[3px] border-pastel-primaryLight rounded-[24px] p-4 text-center text-pastel-navy font-black text-3xl outline-none focus:border-pastel-primary focus:ring-4 focus:ring-pastel-primaryLight shadow-inner transition-all" 
                    value={weight} 
                    onChange={e => setWeight(e.target.value)} 
                    placeholder="0"
                    onFocus={e => e.target.select()} 
                  />
                  {weight === '' && <span className="absolute -top-2 -right-2 text-[10px] bg-pastel-secondary text-white px-3 py-1 rounded-full font-bold shadow-md animate-pulse">Required</span>}
                </div>
            </section>

            {/* Search Bar */}
            <section className="relative w-full" ref={searchRef}>
              <div className={`relative group bg-white rounded-[24px] shadow-soft border-[3px] transition-all ${showDropdown ? 'border-pastel-primary' : 'border-white'}`}>
                <div className="absolute left-6 top-1/2 -translate-y-1/2 text-2xl text-slate-300 group-focus-within:text-pastel-primary transition-all">🔍</div>
                <input 
                    type="text" 
                    placeholder="ค้นหาชื่อยา หรือ กลุ่มยา..." 
                    className="w-full bg-transparent border-none rounded-[24px] py-5 pl-16 pr-6 text-lg font-bold text-pastel-navy outline-none placeholder:text-slate-300" 
                    value={searchQuery} 
                    onChange={(e) => { setSearchQuery(e.target.value); setShowDropdown(true); }} 
                    onFocus={() => setShowDropdown(true)} 
                />
              </div>
              {showDropdown && (
                <div className="absolute w-full mt-2 bg-white rounded-[24px] shadow-2xl max-h-[50vh] overflow-y-auto z-50 border border-slate-100 p-2 animate-fadeIn">
                  {filteredDrugs.length > 0 ? filteredDrugs.map(drug => (
                    <div key={drug.id} className="p-4 rounded-2xl hover:bg-pastel-primaryLight cursor-pointer flex justify-between items-center transition-all mb-1 border border-transparent" onClick={() => handleSelectDrug(drug)}>
                      <div>
                        <p className="font-extrabold text-pastel-navy text-lg">{drug.generic} <span className="text-slate-400 font-medium text-sm">{drug.trade && drug.trade !== '-' ? `(${drug.trade})` : ''}</span></p>
                        <p className="text-[11px] text-pastel-primary font-bold mt-1 bg-white inline-block px-3 py-1 rounded-full uppercase tracking-wider shadow-sm border border-pastel-primaryLight">{getCategoryEmoji(drug.class)} {drug.class}</p>
                      </div>
                      <div className="flex gap-2">{(drug.routes || []).map(r => (<span key={r} className="px-3 py-1 bg-white border border-slate-200 text-slate-500 text-xs font-bold rounded-lg">{r}</span>))}</div>
                    </div>
                  )) : <div className="p-8 text-slate-400 text-center font-bold text-lg">❌ ไม่พบข้อมูลยา</div>}
                </div>
              )}
            </section>

            {}
            {/* Drug Details & Calculator */}
            {selectedDrug && (
              <section className="glass-card p-6 md:p-8 rounded-[32px] shadow-card border border-white relative animate-slideUp">
                
                {/* Header & Reset */}
                <div className="flex justify-between items-start mb-6 pb-6 border-b border-slate-100/50">
                  <div>
                    <span className="inline-block px-3 py-1 bg-white/60 text-slate-600 text-[10px] font-black rounded-full mb-3 uppercase tracking-widest border border-white shadow-sm">{getCategoryEmoji(selectedDrug.class)} {selectedDrug.class}</span>
                    <h2 className="text-3xl md:text-4xl font-black text-pastel-navy leading-none">{selectedDrug.generic}</h2>
                    <span className="block text-pastel-slate font-bold text-lg mt-1">{selectedDrug.trade && selectedDrug.trade !== '-' ? `(${selectedDrug.trade})` : ''}</span>
                  </div>
                  <button onClick={handleResetDrug} className="bg-slate-100 hover:bg-slate-200 text-slate-500 px-4 py-2 rounded-full text-xs font-bold transition-colors flex items-center gap-2 shadow-sm border border-slate-200">
                    ✖ เปลี่ยนยา
                  </button>
                </div>

                {/* Route Selection */}
                {(selectedDrug.routes || []).includes('IV') && (
                  <div className="mb-8">
                    <label className="block text-xs font-black text-pastel-slate mb-3 uppercase tracking-widest flex items-center gap-2"><span className="bg-pastel-primary text-white rounded w-5 h-5 flex items-center justify-center text-[10px]">1</span>Select Route</label>
                    <div className="flex flex-wrap gap-3">
                      {['Peripheral', 'Central'].map(r => {
                        const isAvailable = !!(selectedDrug.concentrations && selectedDrug.concentrations[r]);
                        return (
                          <button key={r} className={`flex-1 py-3 px-4 rounded-2xl font-bold transition-all text-sm border-[3px] shadow-sm ${route === r ? 'bg-white border-pastel-primary text-pastel-primary' : isAvailable ? 'bg-white/50 border-white text-slate-500 hover:bg-white' : 'bg-transparent border-transparent text-slate-300 cursor-not-allowed shadow-none'}`} onClick={() => isAvailable && handleRouteSelect(r)} disabled={!isAvailable}>{r} Line</button>
                        );
                      })}
                    </div>
                  </div>
                )}

                {/* Concentration Selection */}
                <div className={`mb-8 transition-all duration-300 ${(!route && (selectedDrug.routes || []).includes('IV')) ? 'opacity-40 pointer-events-none' : ''}`}>
                  <label className="block text-xs font-black text-pastel-slate mb-3 uppercase tracking-widest flex items-center gap-2"><span className={`rounded w-5 h-5 flex items-center justify-center text-[10px] ${route || !(selectedDrug.routes || []).includes('IV') ? 'bg-pastel-primary text-white' : 'bg-slate-300 text-slate-500'}`}>2</span>Concentration</label>
                  {(!route && (selectedDrug.routes || []).includes('IV')) ? (
                    <div className="bg-white/50 border-2 border-dashed border-slate-200 rounded-2xl p-6 text-center text-slate-400 font-bold"><span className="text-2xl mb-1 block">👆</span>เลือก Route ก่อน</div>
                  ) : (
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">{(selectedDrug.concentrations && selectedDrug.concentrations[route] ? selectedDrug.concentrations[route] : []).map((conc, idx) => (
                      <button key={idx} className={`py-4 px-5 rounded-2xl text-left border-[3px] shadow-sm transition-all ${selectedConc && selectedConc.label === conc.label ? 'bg-white border-pastel-secondary text-pastel-secondary' : 'bg-white/60 border-white text-slate-600 hover:border-pastel-secondaryLight hover:bg-white'}`} onClick={() => { setSelectedConc(conc); setDoseInput(''); setRateInput(''); }}>
                        <div className="font-extrabold text-sm leading-tight mb-1.5">{conc.label}</div>
                        <div className={`text-[10px] font-bold ${selectedConc && selectedConc.label === conc.label ? 'text-pastel-secondary' : 'text-slate-400'}`}>💧 {selectedDrug.fluids}</div>
                      </button>
                    ))}</div>
                  )}
                </div>

                {/* Loading Dose Display (If exists) */}
                {selectedConc && selectedDrug.loading && selectedDrug.loading !== '❌ ไม่มี loading' && selectedDrug.loading !== '❌ No Load' && selectedDrug.loading !== '❌ No Bolus' && selectedDrug.loading !== '❌ Not indicated' && (
                    <div className="bg-blue-50/80 backdrop-blur-sm p-4 rounded-2xl border border-blue-100 shadow-sm mb-6 flex justify-between items-center animate-fadeIn">
                        <div>
                            <span className="block text-blue-500 font-black mb-1.5 text-[10px] uppercase tracking-widest">Loading / Stat Dose</span>
                            <span className="font-black text-blue-900 text-base">{selectedDrug.loading}</span>
                            
                            {/* แสดงผลการคูณด้วยน้ำหนักตัว (Task 1) */}
                            {calculateLoading(selectedDrug.loading, wtNum) && (
                                <span className="block mt-2 text-sm font-bold text-pastel-primary bg-white/80 px-3 py-1.5 rounded-lg border border-blue-100 shadow-sm">
                                  👉 ผลลัพธ์ตามน้ำหนัก = {calculateLoading(selectedDrug.loading, wtNum)}
                                </span>
                            )}
                        </div>
                        <div className="text-3xl drop-shadow-sm ml-4 shrink-0">💉</div>
                    </div>
                )}

                {}
                {/* 2-Way Calculator */}
                <div className={`pt-6 border-t border-slate-100/50 transition-all duration-300 ${!selectedConc ? 'opacity-40 pointer-events-none' : ''}`}>
                  {!selectedConc ? (
                    <div className="bg-white/50 border-2 border-dashed border-slate-200 rounded-2xl p-6 text-center text-slate-400 font-bold"><span className="text-2xl mb-1 block">👆</span>เลือก Concentration ก่อน</div>
                  ) : isMissingWeight ? (
                    <div className="bg-pastel-secondaryLight p-5 rounded-2xl border border-pink-200 text-center shadow-sm">
                        <p className="text-pastel-secondary font-black text-lg">⚖️ กรุณาระบุน้ำหนักด้านบน</p>
                    </div>
                  ) : (
                    <div className="bg-white p-6 md:p-8 rounded-[32px] border border-pastel-primaryLight shadow-soft relative overflow-hidden animate-fadeIn">
                        <div className="absolute top-0 right-0 w-32 h-32 bg-pastel-primaryLight opacity-20 rounded-bl-[100px]"></div>
                        
                        <div className="text-center mb-6">
                            <span className="bg-pastel-primary text-white font-black text-[10px] px-3 py-1.5 rounded-full uppercase tracking-widest shadow-sm">2-Way Calculator</span>
                            <p className="text-slate-500 text-xs font-medium mt-3">กรอกช่องใดช่องหนึ่ง ระบบจะคำนวณอีกฝั่งให้อัตโนมัติ</p>
                            <p className="text-pastel-primary font-bold text-sm mt-1">Recommended: {selectedDrug.maintenance}</p>
                        </div>

                        <div className="flex flex-col md:flex-row items-center justify-center gap-4 md:gap-6 relative">
                            {/* Dose Input */}
                            <div className="w-full relative">
                                <label className="block text-[11px] font-black text-pastel-navy mb-2 text-center uppercase tracking-widest">Dose ({selectedDrug.unit})</label>
                                <input 
                                    type="number" 
                                    className="w-full bg-slate-50 border-[3px] border-slate-200 rounded-[24px] h-[80px] text-center text-3xl font-black text-pastel-navy outline-none focus:bg-white focus:border-pastel-primary focus:ring-4 focus:ring-pastel-primaryLight transition-all shadow-inner" 
                                    placeholder="0" 
                                    value={doseInput} 
                                    onChange={(e) => onDoseChange(e.target.value)} 
                                    onFocus={(e) => e.target.select()}
                                />
                            </div>

                            {/* Swap Icon */}
                            <div className="md:absolute md:top-1/2 md:left-1/2 md:-translate-x-1/2 md:-translate-y-1/2 bg-white w-12 h-12 rounded-full flex items-center justify-center shadow-md border-2 border-pastel-primaryLight text-pastel-primary z-10 shrink-0 transform rotate-90 md:rotate-0 mt-4 md:mt-6">
                                <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={3}>
                                    <path strokeLinecap="round" strokeLinejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
                                </svg>
                            </div>

                            {/* Rate Input */}
                            <div className="w-full relative mt-4 md:mt-0">
                                <label className="block text-[11px] font-black text-pastel-secondary mb-2 text-center uppercase tracking-widest">{selectedDrug.calcType.includes('bolus') ? 'Volume (mL)' : 'Rate (mL/hr)'}</label>
                                <input 
                                    type="number" 
                                    className="w-full bg-pastel-secondaryLight/30 border-[3px] border-pastel-secondaryLight rounded-[24px] h-[80px] text-center text-3xl font-black text-pastel-secondary outline-none focus:bg-white focus:border-pastel-secondary focus:ring-4 focus:ring-pink-100 transition-all shadow-inner" 
                                    placeholder="0" 
                                    value={rateInput} 
                                    onChange={(e) => onRateChange(e.target.value)} 
                                    onFocus={(e) => e.target.select()}
                                />
                            </div>
                        </div>

                        {/* กล่องแสดงตัวอย่างการสั่งยา / การผสมยา (Task 2) */}
                        {rateInput !== '' && parseFloat(rateInput) > 0 && (
                            <div className="mt-6 bg-pastel-primaryLight/30 p-4 rounded-2xl border border-pastel-primaryLight/60 shadow-sm animate-fadeIn">
                                <span className="block text-pastel-primary font-black text-[10px] uppercase tracking-widest mb-2 flex items-center gap-1.5">
                                    <span className="text-sm">📝</span> ตัวอย่างการสั่งยา (Order Example)
                                </span>
                                <div className="bg-white px-4 py-3 rounded-xl text-pastel-navy font-bold text-sm border border-white shadow-sm flex flex-col sm:flex-row sm:items-center gap-2 break-words leading-tight">
                                    <span className="flex-1">{selectedConc.text}</span>
                                    <span className="text-pastel-secondary bg-pastel-secondaryLight/40 px-3 py-1.5 rounded-lg shrink-0 whitespace-nowrap text-center">
                                        {selectedDrug.calcType.includes('bolus') ? `IV ${rateInput} mL` : `IV rate ${rateInput} ml/hr`}
                                    </span>
                                </div>
                            </div>
                        )}

                    </div>
                  )}
                </div>

                {/* Modal Trigger Button */}
                <button onClick={() => setShowClinicalModal(true)} className="w-full mt-6 bg-slate-50 hover:bg-pastel-infoLight text-pastel-info border-2 border-pastel-infoLight px-6 py-4 rounded-2xl text-sm font-black transition-all flex items-center justify-center gap-3">
                    <span className="text-xl">📋</span> ข้อมูลทางคลินิก & ข้อควรระวัง
                </button>

              </section>
            )}
          </main>

          {}
          {/* 📋 Modal: Clinical Data & Warnings */}
          {showClinicalModal && selectedDrug && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-end md:items-center justify-center z-50 p-0 md:p-4 transition-all">
              <div className="bg-white w-full md:max-w-md rounded-t-[32px] md:rounded-[32px] shadow-2xl overflow-hidden flex flex-col max-h-[85vh] animate-slideUp">
                <div className="bg-pastel-info p-5 text-white flex justify-between items-center shrink-0">
                    <h3 className="font-bold text-lg flex items-center gap-2">📋 ข้อมูลเพิ่มเติม</h3>
                    <button onClick={() => setShowClinicalModal(true)} className="text-white/70 hover:text-white font-bold text-3xl leading-none" onClick={() => setShowClinicalModal(false)}>&times;</button>
                </div>
                <div className="p-6 overflow-y-auto bg-slate-50 flex-1 space-y-5">
                    
                    <div>
                        <span className="text-pastel-info font-black text-xs uppercase tracking-widest mb-1.5 block">💡 Clinical Data</span>
                        <div className="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm space-y-3">
                            <div><span className="text-[10px] text-slate-400 font-bold block mb-0.5">Condition</span><span className="text-sm font-semibold text-slate-700">{selectedDrug.conditionSpecific || '-'}</span></div>
                            <div className="pt-2 border-t border-slate-50"><span className="text-[10px] text-slate-400 font-bold block mb-0.5">Compatible Fluids</span><span className="text-sm font-black text-pastel-success">{selectedDrug.fluids}</span></div>
                            {(selectedDrug.onset || selectedDrug.halfLife) && (
                                <div className="pt-2 border-t border-slate-50 flex justify-between">
                                    <div><span className="text-[10px] text-slate-400 font-bold block mb-0.5">Onset</span><span className="text-sm font-semibold text-slate-700">{selectedDrug.onset || '-'}</span></div>
                                    <div className="text-right"><span className="text-[10px] text-slate-400 font-bold block mb-0.5">Half-life</span><span className="text-sm font-semibold text-slate-700">{selectedDrug.halfLife || '-'}</span></div>
                                </div>
                            )}
                        </div>
                    </div>

                    <div>
                        <span className="text-pastel-danger font-black text-xs uppercase tracking-widest mb-1.5 flex items-center gap-1.5 block">🚨 Warnings & Limits</span>
                        <div className="bg-white p-4 rounded-2xl border border-red-100 shadow-sm space-y-3">
                            <div><span className="text-[10px] text-red-400 font-bold block mb-0.5">Max Limit</span><span className="text-sm font-black text-red-600 bg-red-50 px-2 py-1 rounded inline-block">{selectedDrug.limits}</span></div>
                            <div className="pt-2 border-t border-red-50"><span className="text-[10px] text-red-400 font-bold block mb-0.5">Contraindications</span><span className="text-sm font-semibold text-red-700">{selectedDrug.contra}</span></div>
                            <div className="pt-2 border-t border-red-50"><span className="text-[10px] text-red-400 font-bold block mb-0.5">Serious SE</span><span className="text-sm font-semibold text-red-700">{selectedDrug.seriousSE}</span></div>
                            <div className="pt-2 border-t border-red-50"><span className="text-[10px] text-red-400 font-bold block mb-0.5">Precautions</span><span className="text-sm font-medium text-red-500">{selectedDrug.precautions}</span></div>
                        </div>
                    </div>

                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
